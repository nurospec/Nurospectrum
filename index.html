{id:"post-words",tag:"Basics",c:COL[1],title:"Neurodiverse or neurodivergent? The words matter",dek:"Two similar words with different meanings, and why we use both.",
 b:["Neurodiversity describes the natural variation in how human brains work. It is a fact about a group, like biodiversity. A classroom, a family or a country can be neurodiverse.","Neurodivergent describes an individual whose brain works differently from what is typically expected. That includes people who are autistic, have ADHD or dyslexia, and others. The term neurotypical describes people whose thinking fits that typical expectation.","The word neurodiversity was popularised in the late 1990s by the sociologist Judy Singer. The idea behind it is simple: differences in thinking are part of human variety, and people do better when environments adapt instead of expecting everyone to fit one mould."],
 n:"A person is neurodivergent. A community is neurodiverse.",
 s:"Singer, J. (1999). “Why can’t you be normal for once in your life?” In Disability Discourse. Open University Press."},
{id:"post-class",tag:"Education",c:COL[0],title:"Five signs a classroom isn’t working for a neurodivergent student",dek:"Often it is not about effort. It is about the environment.",
 b:["A student who looks distracted, restless or withdrawn may be reacting to noise, unclear instructions or long stretches of passive listening. Labelling them lazy hides the real cause.","Watch for repeated incomplete work despite clear ability, strong distress at changes in routine, avoiding reading or writing aloud, difficulty following spoken multi-step instructions, and exhaustion after school.","Many helpful changes cost nothing: written and spoken instructions together, a quiet corner, extra time, and breaking tasks into steps. The Universal Design for Learning framework recommends offering more than one way to take in information and show understanding."],
 n:"Change the task or space first, then judge the student.",
 s:"CAST (2018). Universal Design for Learning Guidelines version 2.2. udlguidelines.cast.org"},
{id:"post-work",tag:"Work",c:COL[2],title:"How to support a neurodivergent colleague",dek:"Small, specific adjustments, agreed with the person, go a long way.",
 b:["Do not guess what someone needs. Ask: what helps you do your best work? Needs differ widely, even between two people with the same diagnosis.","Common adjustments include written follow-ups after meetings, agendas shared in advance, flexible hours, quieter workspaces and clear, direct feedback.","Research on neurodiversity at work argues that many neurodivergent people bring strengths such as sustained focus, pattern recognition and creative problem solving, but that these show up only when the workplace fits them. Treat strengths and support needs as both true."],
 n:"Ask, agree, write it down, and review it together.",
 s:"Doyle, N. (2020). Neurodiversity at work: a biopsychosocial model and the impact on working adults. British Medical Bulletin, 135(1), 108–125."},
{id:"post-assess",tag:"Support",c:COL[3],title:"If you think your child may be neurodivergent, where to start",dek:"A calm first-steps guide for parents and carers.",
 b:["Write down what you notice at home and at school: when it happens, how often and what helps. Specific examples are more useful to a professional than general worries.","Speak to your child’s teacher and then to a qualified professional, such as a paediatrician, child psychiatrist or clinical psychologist. Diagnosis should come from a trained clinician, not from online checklists.","The World Health Organization’s ICD-11 describes autism spectrum disorder and ADHD under neurodevelopmental conditions, and clinicians use criteria like these when assessing. While you wait, you can already adjust routines, reduce sensory overload and keep communication kind and clear."],
 n:"You do not need a diagnosis to start helping.",
 s:"World Health Organization (2019). ICD-11, Chapter 6: Neurodevelopmental disorders. icd.who.int"}
];

lede:["Nurospectrum is an education and community platform raising awareness of neurodiversity across Nigeria. Every mind is welcome here.","Nurospectrum dandali ne na ilimi da al’umma da ke wayar da kai game da bambancin kwakwalwa (neurodiversity) a faɗin Najeriya. Kowane tunani yana da gurbi a nan.","Nurospectrum jẹ́ pèpéle ẹ̀kọ́ àti àwùjọ tó ń ṣe ìfọ̀rọ̀jíṣẹ́ nípa oríṣiríṣi ọpọlọ (neurodiversity) káàkiri Nàìjíríà. Gbogbo èrò ni a gbà káàbọ̀ níbí.","Nurospectrum bụ ikpo okwu agụmakwụkwọ na obodo na-eme ka mmadụ mara banyere ọdịiche n’ụbụrụ (neurodiversity) n’ofe Naịjirịa niile. Echiche ọ bụla nwere ohere ebe a."],

ab1:["Many neurodivergent Nigerians grow up without the words for how they think, or anyone to share it with. Families and teachers often want to help but have little reliable information.","Yawancin ’yan Najeriya masu bambancin kwakwalwa suna girma ba tare da kalmomin bayyana yadda suke tunani ba, ko wanda za su yi magana da shi. Iyalai da malamai sau da yawa suna son taimakawa amma ba su da ingantattun bayanai.","Ọ̀pọ̀ ọmọ Nàìjíríà tí ọpọlọ wọn yàtọ̀ ló ń dàgbà láìní ọ̀rọ̀ láti ṣàlàyé bí wọ́n ṣe ń ronú, tàbí ẹni tí wọ́n lè bá sọ̀rọ̀. Àwọn ẹbí àti olùkọ́ sábà máa ń fẹ́ ràn wọ́n lọ́wọ́ ṣùgbọ́n wọn kò ní ìmọ̀ tó dájú.","Ọtụtụ ndị Naịjirịa ụbụrụ ha dị iche na-eto na-enweghị okwu ịkọwa otu ha si eche echiche, ma ọ bụ onye ha ga-agwa. Ezinụlọ na ndị nkụzi na-achọkarị inyere aka mana ha enweghị ozi ziri ezi."],
ab2:["Nurospectrum answers both. We publish well-sourced, plain-language articles, build state-by-state communities where “specs” can find each other, and host events that bring families, schools and employers into the conversation.","Nurospectrum na magance duka biyun. Muna wallafa labarai masu sauƙi da tushe, muna gina al’umma a kowace jiha inda “specs” za su sami juna, kuma muna shirya taruka da ke haɗa iyalai, makarantu da ma’aikata.","Nurospectrum ń yanjú méjèèjì. À ń tẹ̀ àwọn àpilẹ̀kọ tó rọrùn, tó ní orísun jáde, à ń kọ́ àwùjọ ní ìpínlẹ̀ kọ̀ọ̀kan níbi tí “specs” ti lè rí ara wọn, a sì ń ṣètò àwọn ìpàdé tó so ẹbí, ilé-ìwé àti ibi iṣẹ́ pọ̀.","Nurospectrum na-azaghachi ha abụọ. Anyị na-ebipụta edemede dị mfe nwere isi iyi, na-ewu obodo n’steeti ọ bụla ebe “specs” nwere ike ịchọta ibe ha, ma na-ahazi emume na-ejikọta ezinụlọ, ụlọ akwụkwọ na ebe ọrụ."],

function post(p){

function community(){
 app.innerHTML='<div class="wrap"><section class="sec"><h1>'+t("ch")+'</h1><p class="lede">'+t("cl")+'</p><div class="states" id="states" role="group"></div><div id="join"></div></section></div>';
 var box=$("#states");

 if(chosen){
  var ro=D.roles[LI].map(function(r){return '<option>'+r+'</option>'}).join("");

 } else $("#join").innerHTML='<p class="lede">'+t("cs")+'</p>';
}

}
function route(){
 var k=location.hash.replace("#","")||"home",cur=k,p=POSTS.filter(function(x){return x.id===k})[0];

 window.scrollTo(0,0);
}
